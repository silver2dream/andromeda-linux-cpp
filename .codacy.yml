---
# Codacy configuration file
# Exclude files and directories that shouldn't be analyzed for code quality

exclude_paths:
  # Documentation files
  - 'README*.md'
  - 'CONTRIBUTING.md'
  - 'TESTING_CHECKLIST.md'
  - 'SECURITY_FIXES.md'
  - 'LICENSE'
  - 'CHANGELOG.md'
  
  # GitHub specific files
  - '.github/**'
  - '.github/ISSUE_TEMPLATE/**'
  - '.github/workflows/**'
  
  # Build and generated files
  - 'cmake-build-debug/**'
  - 'build/**'
  - 'generated/**'
  - 'logs/**'
  - 'actions-runner/**'
  
  # Configuration files
  - '.clang-format'
  - '.gitignore'
  - '.gitattributes'
  - 'andromeda.conf'
  - 'Dockerfile'
  - '*.yml'
  - '*.yaml'

# Configure tools
tools:
  # Disable certain tools for markdown files
  remark-lint:
    enabled: false
  
  # Configure ESLint for YAML files
  eslint:
    enabled: false
  
  # Enable C++ analysis tools
  cppcheck:
    enabled: true
    
  clang-tidy:
    enabled: true
    
  # Enable security analysis
  bandit:
    enabled: false  # Python only
    
  # Security patterns
  security-code-scan:
    enabled: false  # .NET only

# Patterns to exclude from duplication analysis
duplication:
  exclude_paths:
    - '.github/**'
    - '**/*.md'
    - 'generated/**'
    - '**/*.yml'
    - '**/*.yaml'
    - 'logs/**'

# Coverage settings
coverage:
  exclude_paths:
    - '.github/**'
    - '**/*.md'
    - 'generated/**'
    - 'logs/**'
    - 'cmake-build-debug/**'
    - 'build/**'

# Custom patterns for C++ security
engines:
  cppcheck:
    enabled: true
    exclude_paths:
      - 'generated/**'
    
  clang-tidy:
    enabled: true
    exclude_paths:
      - 'generated/**'
      - 'net/ikcp.c'  # Third-party code

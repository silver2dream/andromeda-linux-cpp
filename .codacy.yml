---
# Codacy configuration file

# Exclude files and directories that shouldn't be analyzed
exclude_paths:
  # Documentation files
  - 'README*.md'
  - 'CONTRIBUTING.md'
  - 'TESTING_CHECKLIST.md'
  - 'SECURITY_FIXES.md'
  - 'CODACY_DEBUG.md'
  - 'LICENSE'
  
  # GitHub specific files
  - '.github/**'
  
  # Build and generated files
  - 'cmake-build-debug/**'
  - 'build/**'
  - 'generated/**'
  - 'logs/**'
  - 'actions-runner/**'
  
  # Third-party libraries (KCP protocol implementation)
  - '_include/ikcp.h'      # Third-party KCP library header
  - 'net/ikcp.c'           # Third-party KCP library implementation
  
  # Configuration files (but keep source code analysis)
  - '.clang-format'
  - '.gitignore'
  - '.gitattributes'
  - 'andromeda.conf'
  - 'Dockerfile'

# Configure analysis engines
engines:
  # C++ analysis
  cppcheck:
    enabled: true
    exclude_paths:
      - 'generated/**'
      - 'cmake-build-debug/**'
      - 'build/**'
      - '_include/ikcp.h'
      - 'net/ikcp.c'
    
  clang-tidy:
    enabled: true
    exclude_paths:
      - 'generated/**'
      - 'cmake-build-debug/**' 
      - 'build/**'
      - '_include/ikcp.h'    # Third-party KCP implementation
      - 'net/ikcp.c'         # Third-party KCP implementation
  
  # Disable non-C++ tools
  eslint:
    enabled: false
    
  remark-lint:
    enabled: false
    
  bandit:
    enabled: false
    
  pylint:
    enabled: false

# Duplication detection settings
duplication:
  exclude_paths:
    - '.github/**'
    - '**/*.md'
    - 'generated/**'
    - 'cmake-build-debug/**'
    - 'build/**'
    - '_include/ikcp.h'
    - 'net/ikcp.c'

# Coverage settings  
coverage:
  exclude_paths:
    - '.github/**'
    - '**/*.md'
    - 'generated/**'
    - 'logs/**'
    - 'cmake-build-debug/**'
    - 'build/**'
    - '_include/ikcp.h'
    - 'net/ikcp.c'
